services:
  - type: web
    name: dt-mcp-server
    runtime: python
    buildCommand: pip install uv && uv pip install -r requirements.txt --system
    startCommand: python servers/http_server.py
    envVars:
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: OAUTH_CALLBACK_URL
        sync: false
      - key: DATA_STORAGE_PATH
        value: /tmp/data
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
    healthCheckPath: /health
